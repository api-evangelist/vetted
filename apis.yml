aid: vetted
name: Vetted
description: >-
  Vetted (formerly Lustre) is a San Francisco based AI-powered shopping research assistant that helps
  consumers find the best products and lowest prices. The service analyzes reviews and recommendations
  from trusted sources such as Reddit, YouTube, user reviews, and expert articles to surface the most
  recommended brands and products for a shopper's needs, then compares retailers to identify the best
  available price. Vetted is delivered as consumer iOS and Android mobile apps and a web experience,
  and is backed by Index Ventures. It exposes no public developer API, documentation, or developer
  portal at this time (api.vetted.ai serves the mobile apps as a private backend). This profile was
  added to the API Evangelist network as a portfolio-lead stub.
